<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术支持 · 故障排查向导</title>
<style>
  :root {
    --ink:#1a2230; --ink-soft:#4a5568; --line:#e2e6ec; --bg:#f6f8fa; --card:#fff;
    --brand:#1f6feb; --brand-dark:#1a5fd0; --brand-tint:#eaf2ff;
    --ok:#16a34a; --warn:#d97706; --stop:#dc2626;
    --radius:12px; --shadow:0 1px 3px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.05);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 20px 80px; }
  header.top { border-bottom:1px solid var(--line); background:#fff; }
  .top-inner { max-width:820px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; gap:12px; }
  .logo { font-weight:700; font-size:17px; letter-spacing:.2px; }
  .logo .dot { color:var(--brand); }
  .top-tag { margin-left:auto; font-size:12px; color:var(--ink-soft); background:var(--brand-tint); padding:4px 10px; border-radius:20px; }
  .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); margin:20px 0 18px; }
  .crumbs button { border:none; background:none; color:var(--brand); cursor:pointer; font-size:13px; padding:2px 4px; border-radius:6px; font-family:inherit; }
  .crumbs button:hover { background:var(--brand-tint); }
  .crumbs .sep { color:#b6bfcc; }
  .eyebrow { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--brand); font-weight:700; }
  h1.q { font-size:22px; margin:6px 0 4px; line-height:1.3; }
  .sub { color:var(--ink-soft); font-size:14px; margin-bottom:20px; }
  .search { position:relative; margin-bottom:22px; }
  .search input { width:100%; padding:13px 14px 13px 42px; font-size:15px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; font-family:inherit; color:var(--ink); }
  .search input:focus { outline:2px solid var(--brand); border-color:var(--brand); }
  .search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#9aa5b4; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .choice { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer; font-family:inherit; transition:.14s; display:flex; gap:12px; align-items:flex-start; box-shadow:var(--shadow); }
  .choice:hover { border-color:var(--brand); transform:translateY(-1px); }
  .choice:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .choice .ico { font-size:22px; line-height:1; flex-shrink:0; margin-top:1px; }
  .choice .body { min-width:0; }
  .choice .name { font-weight:650; font-size:15px; }
  .choice .desc { font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .choice.soon { opacity:.55; cursor:default; }
  .choice.soon:hover { border-color:var(--line); transform:none; }
  .badge-soon { font-size:10px; background:#eef1f5; color:#8794a5; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .badge-feat { font-size:10px; background:#eaf2ff; color:#1f6feb; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .swatch { width:30px; height:30px; border-radius:8px; flex-shrink:0; margin-top:1px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); border-left:4px solid var(--brand); }
  .panel.ok { border-left-color:var(--ok); } .panel.warn { border-left-color:var(--warn); } .panel.stop { border-left-color:var(--stop); }
  .panel .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:3px 9px; border-radius:20px; margin-bottom:12px; }
  .tag.cause { background:var(--brand-tint); color:var(--brand-dark); }
  .tag.ok { background:#e7f6ec; color:var(--ok); } .tag.warn { background:#fdf0dc; color:var(--warn); } .tag.stop { background:#fdeaea; color:var(--stop); }
  .panel h2 { font-size:18px; margin:0 0 10px; }
  .panel p { margin:0 0 12px; font-size:14.5px; color:#33404f; }
  .steps { margin:0 0 14px; padding-left:0; list-style:none; counter-reset:s; }
  .steps li { position:relative; padding:6px 0 6px 34px; font-size:14.5px; border-bottom:1px dashed var(--line); }
  .steps li:last-child { border-bottom:none; }
  .steps li::before { counter-increment:s; content:counter(s); position:absolute; left:0; top:6px; width:22px; height:22px; background:var(--brand); color:#fff; border-radius:50%; font-size:12px; font-weight:700; display:grid; place-items:center; }
  .note { background:#fbfcfe; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--ink-soft); }
  .note b { color:var(--ink); }
  .followup { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .followup .fq { font-weight:650; font-size:15px; margin-bottom:10px; }
  .yn { display:flex; gap:10px; flex-wrap:wrap; }
  .yn button { flex:1; min-width:130px; padding:11px; border:1px solid var(--line); background:#fff; border-radius:10px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink); transition:.14s; }
  .yn button:hover { border-color:var(--brand); background:var(--brand-tint); }
  .stuck { margin-top:22px; background:linear-gradient(180deg,#fff,#f9fbff); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
  .stuck h3 { margin:0 0 4px; font-size:15px; }
  .stuck p { margin:0 0 14px; font-size:13px; color:var(--ink-soft); }
  .stuck-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { padding:10px 16px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; border:1px solid var(--brand); }
  .btn.primary { background:var(--brand); color:#fff; } .btn.primary:hover { background:var(--brand-dark); }
  .btn.ghost { background:#fff; color:var(--brand); } .btn.ghost:hover { background:var(--brand-tint); }
  .back-link { margin-top:20px; } .back-link button { background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; font-family:inherit; padding:4px; }
  .back-link button:hover { color:var(--brand); }
  .ref { margin-top:30px; border-top:1px solid var(--line); padding-top:18px; }
  .ref summary { cursor:pointer; font-weight:650; font-size:14px; color:var(--ink); }
  .ref table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
  .ref th,.ref td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .ref th { background:#f2f5f8; font-weight:600; }
  .ref td:first-child { font-weight:600; white-space:nowrap; }
  .fade { animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .fade { animation:none; } }
  .loading { color:var(--ink-soft); font-size:14px; padding:40px 0; text-align:center; }
  /* ── added for the 3-level rebuild ───────────────────────────── */
  .langs { margin-left:auto; display:flex; gap:2px; }
  .langs button { border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    font:inherit; font-size:12px; padding:4px 9px; border-radius:7px; cursor:pointer; }
  .langs button[aria-current="true"] { background:var(--brand-tint); border-color:var(--brand);
    color:var(--brand-dark); font-weight:700; }
  .when { display:inline-block; margin:0 0 8px; padding:3px 9px; border-radius:99px;
    background:var(--brand-tint); color:var(--brand-dark); font-size:12px; font-weight:600; }
  .answers { display:flex; flex-direction:column; gap:14px; }
  .results { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .result { display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff;
    border-radius:var(--radius); padding:12px 14px; cursor:pointer; font:inherit; color:inherit; }
  .result:hover { border-color:var(--brand); background:var(--brand-tint); }
  .result .rname { font-weight:700; font-size:14px; }
  .result .rpath { display:block; margin-top:2px; font-size:12px; color:var(--ink-soft); }
  .empty { padding:14px; color:var(--ink-soft); font-size:14px; }
  .src-note { margin-top:26px; font-size:12px; color:var(--ink-soft); }
  .src-note span { display:block; }
  .ring-dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px;
    vertical-align:-1px; box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--line); }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <span class="logo" id="brandName">ETIA<span class="dot">.</span></span>
    <span class="top-tag" id="tagLine"></span>
    <span class="langs" id="langs"></span>
  </div>
</header>
<div class="wrap">
  <nav class="crumbs" id="crumbs"></nav>
  <div id="app"><div class="loading">…</div></div>
  <div class="back-link" id="backLink"></div>
  <div class="src-note" id="srcNote"></div>
</div>

<script>
/* ────────────────────────────────────────────────────────────────
   Three screens, and no more:
     1. product   — the model on the nameplate
     2. symptom   — what is happening
     3. answer    — every cause for that symptom, on one page

   The old build had brand → product → symptom → a chain of yes/no
   questions before an answer appeared: five or six taps for a fact
   that is one line in the user guide. Customers said it was too much
   work, and they were right. The yes/no questions were not thrown
   away — each one became the "applies when" line on the cause it used
   to gate, so the reader scans instead of clicking.

   All visible copy is {en,zh,th,vi} in troubleshooter-data.json, so
   adding a product still means editing only that file.
   ──────────────────────────────────────────────────────────────── */

const LANGS = ["en", "zh", "th", "vi"];
const LANG_LABEL = { en: "EN", zh: "中文", th: "ไทย", vi: "VI" };

function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("ts-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  const n = (navigator.language || "en").toLowerCase();
  if (n.startsWith("zh")) return "zh";
  if (n.startsWith("th")) return "th";
  if (n.startsWith("vi")) return "vi";
  return "en";
}
let LANG = initialLang();
/** Read a {en,zh,th,vi} value in the current language, falling back to English. */
const T = (v) => (v && (v[LANG] || v.en)) || "";

let DATA = null;
const app = document.getElementById("app");
const crumbsEl = document.getElementById("crumbs");
const backEl = document.getElementById("backLink");
const langsEl = document.getElementById("langs");

let state = { product: null, symptom: null, query: "" };

/* ---- boot ---- */
async function boot() {
  try {
    const res = await fetch("troubleshooter-data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("http " + res.status);
    DATA = await res.json();
  } catch (e) {
    // No stale inline copy of the content: a fallback that silently serves
    // last year's troubleshooting steps is worse than an honest failure.
    app.innerHTML = `<div class="panel stop"><h2>Could not load the troubleshooting data</h2>
      <p>Please reload the page. If it keeps failing, contact an ETIA engineer directly —
      <a href="mailto:guoren_wang@etia-tech.com">guoren_wang@etia-tech.com</a>.</p></div>`;
    return;
  }
  renderLangs();
  render();
}

function setLang(l) {
  LANG = l;
  try { localStorage.setItem("ts-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  renderLangs();
  render();
}
function renderLangs() {
  langsEl.innerHTML = LANGS.map((l) =>
    `<button onclick="setLang('${l}')" aria-current="${l === LANG}">${LANG_LABEL[l]}</button>`).join("");
  document.getElementById("brandName").innerHTML = `${esc(T(DATA.ui.brand))}<span class="dot">.</span>`;
  document.getElementById("tagLine").textContent = T(DATA.ui.tagline);
  document.getElementById("srcNote").innerHTML =
    `<span>${esc(T(DATA.ui.src))}</span><span>${esc(T(DATA.ui.review))}</span>`;
  document.title = `${T(DATA.ui.brand)} · ${T(DATA.ui.tagline)}`;
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---- navigation ---- */
function pickProduct(id) { state.product = DATA.products.find((p) => p.id === id); state.symptom = null; state.query = ""; render(); }
function pickSymptom(id) { state.symptom = state.product.symptoms.find((s) => s.id === id); render(); }
function toHome() { state = { product: null, symptom: null, query: "" }; render(); }
function toProduct() { state.symptom = null; render(); }
function stepBack() { if (state.symptom) toProduct(); else if (state.product) toHome(); }
/** Jump straight from a search hit to its answer, skipping both earlier screens. */
function jump(pid, sid) { state.product = DATA.products.find((p) => p.id === pid); state.symptom = state.product.symptoms.find((s) => s.id === sid); state.query = ""; render(); }

function render() {
  renderCrumbs();
  if (!state.product) return renderHome();
  if (!state.symptom) return renderSymptoms();
  return renderAnswer();
}

function renderCrumbs() {
  const parts = [`<button onclick="toHome()">${esc(T(DATA.ui.home_crumb))}</button>`];
  if (state.product) parts.push(`<span class="sep">›</span><button onclick="toProduct()">${esc(state.product.name)}</button>`);
  if (state.symptom) parts.push(`<span class="sep">›</span><button>${esc(T(state.symptom.name))}</button>`);
  crumbsEl.innerHTML = parts.join(" ");
  backEl.innerHTML = state.product ? `<button onclick="stepBack()">${esc(T(DATA.ui.back))}</button>` : "";
}

/* ---- 1. products, search, and a way straight to a human ---- */
function renderHome() {
  app.className = "fade";
  app.innerHTML = `
    <div><h1 class="q">${esc(T(DATA.ui.home_h1))}</h1>
    <div class="sub">${esc(T(DATA.ui.home_sub))}</div></div>
    ${searchBox()}
    <div id="searchResults"></div>
    <div class="grid" id="productGrid">
      ${DATA.products.map((p) => `
        <button class="choice" onclick="pickProduct('${p.id}')"><span class="ico">${p.icon}</span>
          <span class="body"><span class="name">${esc(p.name)}</span>
          <span class="desc">${esc(T(p.desc))}</span></span></button>`).join("")}
    </div>
    ${contactBox()}`;
  wireSearch();
}

/* ---- 2. symptoms for the chosen model ---- */
function renderSymptoms() {
  app.className = "fade";
  const p = state.product;
  app.innerHTML = `
    <div><div class="eyebrow">${esc(p.name)}</div>
    <h1 class="q">${esc(T(DATA.ui.symptoms_h1))}</h1>
    <div class="sub">${esc(T(DATA.ui.symptoms_sub))}</div></div>
    <div class="grid">
      ${p.symptoms.map((s) => `
        <button class="choice" onclick="pickSymptom('${s.id}')">
          <span class="body"><span class="name">${esc(T(s.name))}</span></span></button>`).join("")}
    </div>
    ${refTable(p.id)}
    ${contactBox()}`;
}

/* ---- 3. the answer: every cause, on one page ---- */
function renderAnswer() {
  app.className = "fade";
  const s = state.symptom;
  app.innerHTML = `
    <div><div class="eyebrow">${esc(state.product.name)}</div>
    <h1 class="q">${esc(T(s.name))}</h1>
    <div class="sub">${esc(T(DATA.ui.answer_sub))}</div></div>
    <div class="answers">${s.causes.map(causeCard).join("")}</div>
    ${refTable(state.product.id)}
    ${contactBox()}`;
}

function causeCard(c) {
  const lvl = ["ok", "warn", "stop"].includes(c.level) ? c.level : "";
  const tagClass = lvl || "cause";
  const dot = c.swatch ? `<span class="ring-dot" style="background:${esc(c.swatch)}"></span>` : "";
  return `<div class="panel ${lvl}">
    <span class="tag ${tagClass}">${dot}${esc(T(c.tag))}</span>
    ${c.when ? `<div class="when">${esc(T(DATA.ui.when))}: ${esc(T(c.when))}</div>` : ""}
    <h2>${esc(T(c.title))}</h2>
    <p>${esc(T(c.intro))}</p>
    <ol class="steps">${c.steps.map((st) => `<li>${esc(T(st))}</li>`).join("")}</ol>
    ${c.note ? `<div class="note"><b>${esc(T(DATA.ui.note))}:</b> ${esc(T(c.note))}</div>` : ""}
  </div>`;
}

/* ---- search: symptoms and cause titles, across every product ---- */
function searchBox() {
  return `<div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="tsSearch" type="search" autocomplete="off" placeholder="${esc(T(DATA.ui.search_ph))}" value="${esc(state.query)}"></div>`;
}
function wireSearch() {
  const input = document.getElementById("tsSearch");
  if (!input) return;
  input.addEventListener("input", () => { state.query = input.value; paintResults(); });
  if (state.query) paintResults();
}
const fold = (s) => String(s).toLowerCase().replace(/[\s\-_./]/g, "");
function searchHits(q) {
  const tokens = q.trim().split(/\s+/).map(fold).filter(Boolean);
  if (!tokens.length) return [];
  const hits = [];
  for (const p of DATA.products) {
    for (const s of p.symptoms) {
      // A symptom matches on its own name, on any cause title or tag, and on
      // the reference table's error codes — "Error 1" should find its way home.
      const hay = fold([T(s.name), s.id, p.name,
        ...s.causes.flatMap((c) => [T(c.title), T(c.tag), T(c.intro)])].join(" "));
      if (tokens.every((t) => hay.includes(t))) hits.push({ p, s });
    }
  }
  return hits.slice(0, 10);
}
function paintResults() {
  const box = document.getElementById("searchResults");
  const grid = document.getElementById("productGrid");
  if (!box) return;
  const q = state.query.trim();
  if (!q) { box.innerHTML = ""; if (grid) grid.style.display = ""; return; }
  const hits = searchHits(q);
  if (grid) grid.style.display = hits.length ? "none" : "";
  box.innerHTML = hits.length
    ? `<div class="results">${hits.map((h) => `
        <button class="result" onclick="jump('${h.p.id}','${h.s.id}')">
          <span class="rname">${esc(T(h.s.name))}</span>
          <span class="rpath">${esc(h.p.name)}</span></button>`).join("")}</div>`
    : `<div class="empty">${esc(T(DATA.ui.no_result))}</div>`;
}

/* ---- contact: a real mailto, carrying where the reader got to ---- */
function ctx() {
  const bits = [];
  if (state.product) bits.push(state.product.name);
  if (state.symptom) bits.push(T(state.symptom.name));
  return bits.join(" / ");
}
function mailto(to, subject) {
  const where = ctx();
  const body = [
    where ? `Product / symptom: ${where}` : "Product / symptom:",
    "",
    "What I am seeing:",
    "",
    "Serial number (if known):",
    "Site / country:",
    "Contact name and phone:",
    "",
  ].join("\n");
  return `mailto:${to}?subject=${encodeURIComponent(where ? `${subject} — ${where}` : subject)}&body=${encodeURIComponent(body)}`;
}
function contactBox() {
  const c = DATA.contact;
  return `<div class="stuck">
    <h3>${esc(state.product ? T(DATA.ui.stuck_h) : T(DATA.ui.contact_now))}</h3>
    <p>${esc(T(DATA.ui.stuck_b))}</p>
    <div class="stuck-actions">
      <a class="btn primary" href="${mailto(c.engineer_email, "OmniCure technical support")}">${esc(T(DATA.ui.contact_eng))}</a>
      <a class="btn ghost" href="${esc(c.line_url)}" target="_blank" rel="noopener noreferrer">${esc(T(DATA.ui.contact_line))}</a>
      <a class="btn ghost" href="${mailto(c.sales_email, "OmniCure parts enquiry")}">${esc(T(DATA.ui.contact_parts))}</a>
    </div></div>`;
}

function refTable(pid) {
  const t = DATA.ref_tables[pid];
  if (!t) return "";
  return `<details class="ref"><summary>${esc(T(DATA.ui.ref_open))}: ${esc(T(t.title))}</summary>
    <table><thead><tr>${t.cols.map((c) => `<th>${esc(T(c))}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(typeof c === "string" ? c : T(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></details>`;
}

boot();
</script>
</body>
</html>
